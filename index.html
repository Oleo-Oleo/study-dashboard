<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공부 매니저 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #121212; color: #fff; overflow: hidden; }

    /* 전체화면 버튼 (좌측 상단 고정) */
    .fullscreen-btn { position: absolute; top: 15px; left: 15px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; z-index: 100; transition: background 0.2s; }
    .fullscreen-btn:hover { background: #3a3a3a; }

    /* 좌측: 타이머 섹션 */
    .left-panel { flex: 1; border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .clock-container { text-align: center; margin-bottom: 25px; }
    .clock-title { font-size: 0.9rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .clock { font-size: 2.2rem; color: #e0e0e0; font-weight: 600; font-family: monospace; }
    
    .timer-container { text-align: center; margin-bottom: 30px; }
    .timer-title { font-size: 0.9rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .timer { font-size: 5.5rem; font-weight: bold; font-family: monospace; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
    
    .btn-group { display: flex; gap: 12px; }
    .btn-group button { font-size: 1.1rem; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .btn-group button:hover { opacity: 0.9; }
    .start { background: #00ffcc; color: #000; }
    .stop { background: #ff4d4d; color: #fff; }
    .reset { background: #555; color: #fff; }

    /* 우측: 메인 관리 섹션 */
    .right-panel { flex: 1.2; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
    
    /* 데이터 저장 / 불러오기 바 */
    .file-bar { background: #1e1e1e; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 10px; border: 1px solid #2a2a2a; }
    .file-bar input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 0.95rem; }
    .file-bar button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .save-btn { background: #00ffcc; color: #000; }
    .load-btn { background: #3a3a3a; color: #fff; border: 1px solid #555 !important; }
    #fileInput { display: none; }

    .box { background: #1e1e1e; padding: 18px; border-radius: 12px; flex: 1; display: flex; flex-direction: column; border: 1px solid #2a2a2a; }
    .box h2 { font-size: 1.2rem; margin-bottom: 12px; color: #00ffcc; display: flex; justify-content: space-between; align-items: center; }
    
    /* 투두 리스트 */
    .todo-input { display: flex; gap: 10px; margin-bottom: 12px; }
    .todo-input input { flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 0.95rem; }
    .todo-input button { padding: 10px 18px; background: #00ffcc; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .todo-list { list-style: none; overflow-y: auto; flex: 1; max-height: 220px; }
    .todo-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #2a2a2a; border-radius: 6px; margin-bottom: 8px; font-size: 1rem; }
    .todo-left { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .todo-list li.done span { text-decoration: line-through; color: #666; }
    .del-btn { background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 1.1rem; padding: 0 5px; }

    /* 메모장 */
    textarea { width: 100%; flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 6px; resize: none; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- 전체화면 버튼 (좌측 상단) -->
  <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullScreen()">⛶ 전체화면</button>

  <!-- 좌측: 시계 및 타이머 -->
  <div class="left-panel">
    <div class="clock-container">
      <div class="clock-title">현재 시간</div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
    
    <div class="timer-container">
      <div class="timer-title">스톱워치</div>
      <div class="timer" id="timer">00:00:00</div>
    </div>

    <div class="btn-group">
      <button class="start" id="startBtn">시작</button>
      <button class="stop" id="stopBtn">일시정지</button>
      <button class="reset" id="resetBtn">리셋</button>
    </div>
  </div>

  <!-- 우측: 메인 관리 섹션 -->
  <div class="right-panel">
    
    <!-- 데이터 저장 / 불러오기 바 -->
    <div class="file-bar">
      <input type="text" id="saveNameInput" placeholder="저장할 이름 (예: 영어공부, 중간고사)">
      <button class="save-btn" id="saveFileBtn">데이터 저장</button>
      <button class="load-btn" id="loadFileBtn">데이터 불러오기</button>
      <input type="file" id="fileInput" accept=".json">
    </div>

    <!-- 목표/할일 목록 -->
    <div class="box">
      <h2>오늘의 목표 / 범위</h2>
      <div class="todo-input">
        <input type="text" id="todoInput" placeholder="할 일 입력 (예: 수학 30p~35p 풀기)">
        <button id="addBtn">추가</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </div>

    <!-- 메모장 -->
    <div class="box">
      <h2>빠른 메모</h2>
      <textarea id="memo" placeholder="공부 중 필요한 메모나 오답을 적으세요..."></textarea>
    </div>
  </div>

  <script>
    // 1. 현재 시계
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 타이머/스톱워치
    let timerInterval = null;
    let seconds = parseInt(localStorage.getItem('my_seconds') || '0', 10);
    let isRunning = localStorage.getItem('my_timer_running') === 'true';
    let lastStartTime = parseInt(localStorage.getItem('my_last_start_time') || '0', 10);

    if (isRunning && lastStartTime > 0) {
      const now = Date.now();
      const elapsed = Math.floor((now - lastStartTime) / 1000);
      seconds += elapsed;
      localStorage.setItem('my_seconds', seconds);
      localStorage.setItem('my_last_start_time', now);
    }

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateTimerDisplay() {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
    }

    function startTimer() {
      if (timerInterval) return;
      isRunning = true;
      localStorage.setItem('my_timer_running', 'true');
      localStorage.setItem('my_last_start_time', Date.now());

      timerInterval = setInterval(() => {
        seconds++;
        localStorage.setItem('my_seconds', seconds);
        localStorage.setItem('my_last_start_time', Date.now());
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      localStorage.setItem('my_timer_running', 'false');
    }

    function resetTimer() {
      stopTimer();
      seconds = 0;
      localStorage.setItem('my_seconds', '0');
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', resetTimer);

    if (isRunning) {
      startTimer();
    } else {
      updateTimerDisplay();
    }

    // 3. localStorage 헬퍼
    function setStorage(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }
    function getStorage(key, defaultVal) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    }

    // 4. 투두리스트
    let todos = getStorage('my_todos', []);
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');

    function renderTodos() {
      todoList.innerHTML = '';
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        li.innerHTML = `
          <div class="todo-left" onclick="toggleTodo(${index})">
            <input type="checkbox" ${todo.done ? 'checked' : ''} style="pointer-events:none;">
            <span>${todo.text}</span>
          </div>
          <button class="del-btn" onclick="deleteTodo(event, ${index})">✕</button>
        `;
        todoList.appendChild(li);
      });
      setStorage('my_todos', todos);
    }

    function addTodo() {
      const text = todoInput.value.trim();
      if (!text) return;
      todos.push({ text: text, done: false });
      todoInput.value = '';
      renderTodos();
    }

    window.toggleTodo = function(index) {
      todos[index].done = !todos[index].done;
      renderTodos();
    };

    window.deleteTodo = function(event, index) {
      event.stopPropagation();
      todos.splice(index, 1);
      renderTodos();
    };

    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTodo(); });
    renderTodos();

    // 5. 메모장
    const memo = document.getElementById('memo');
    memo.value = getStorage('my_memo_text', '');
    memo.addEventListener('input', () => {
      setStorage('my_memo_text', memo.value);
    });

    // 6. 전체화면 토글
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 7. 데이터 저장 및 불러오기
    const saveNameInput = document.getElementById('saveNameInput');
    const saveFileBtn = document.getElementById('saveFileBtn');
    const loadFileBtn = document.getElementById('loadFileBtn');
    const fileInput = document.getElementById('fileInput');

    function getYYMMDD() {
      const d = new Date();
      const yy = String(d.getFullYear()).slice(2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}${mm}${dd}`;
    }

    saveFileBtn.addEventListener('click', () => {
      const customName = saveNameInput.value.trim();
      const prefix = getYYMMDD();
      const filename = customName ? `${prefix}-${customName}.json` : `${prefix}-공부기록.json`;

      const dataToSave = {
        version: "1.0",
        date: new Date().toISOString(),
        seconds: seconds,
        todos: todos,
        memo: memo.value
      };

      const jsonStr = JSON.stringify(dataToSave, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    });

    loadFileBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          
          if (data.seconds !== undefined) {
            seconds = data.seconds;
            localStorage.setItem('my_seconds', seconds);
            updateTimerDisplay();
          }
          
          if (data.todos !== undefined) {
            todos = data.todos;
            renderTodos();
          }

          if (data.memo !== undefined) {
            memo.value = data.memo;
            setStorage('my_memo_text', memo.value);
          }

          alert("성공적으로 데이터를 불러왔습니다!");
        } catch (err) {
          alert("파일을 불러오는 중 오류가 발생했습니다. 올바른 파일인지 확인하세요.");
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });
  </script>
</body>
</html>
